  # Handles email notifications based on check results
  notify:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 1. New security tag found
      - name: Send Mail - New Tag Found
        if: needs.check.outputs.update == 'true' && needs.check.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_RECIPIENT }}
          from: "CI Build Bot <${{ secrets.MAIL_USERNAME }}>"
          subject: "🛡️ NEW KERNEL TAG FOUND: ${{ needs.check.outputs.new_tag }}"
          html_body: |
            <h2>New Kernel Security Tag Found</h2>
            <p>A new kernel security update has been found for repository <b>${{ github.repository }}</b>.</p>
            <ul>
              <li><b>Current Tag:</b> ${{ needs.check.outputs.current_tag }}</li>
              <li><b>New Tag:</b> ${{ needs.check.outputs.new_tag }}</li>
              <li><b>Proposed Branch:</b> ${{ needs.check.outputs.branch }}</li>
            </ul>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>

      # 2. No new security tags / up to date
      - name: Send Mail - No Update Needed
        if: needs.check.outputs.update == 'false' && needs.check.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_RECIPIENT }}
          from: "CI Build Bot <${{ secrets.MAIL_USERNAME }}>"
          subject: "✅ Kernel Up to Date (${{ needs.check.outputs.current_tag }})"
          html_body: |
            <h2>No Security Updates Found</h2>
            <p>The kernel check completed and no newer tags with CVE fixes were identified.</p>
            <ul>
              <li><b>Current Tag:</b> ${{ needs.check.outputs.current_tag }}</li>
              <li><b>Status:</b> Up to date</li>
            </ul>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>

      # 3. Check job failure
      - name: Send Mail - Check Job Failed
        if: needs.check.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_RECIPIENT }}
          from: "CI Build Bot <${{ secrets.MAIL_USERNAME }}>"
          subject: "🚨 FAILURE: Kernel Check Job Failed"
          html_body: |
            <h2>Check Job Execution Failed</h2>
            <p>An error occurred while checking kernel tags in repository <b>${{ github.repository }}</b>.</p>
            <ul>
              <li><b>Triggered By:</b> ${{ github.actor }}</li>
              <li><b>Ref / Branch:</b> ${{ github.ref_name }}</li>
            </ul>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Inspect Logs</a></p>
