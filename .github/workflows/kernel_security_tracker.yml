name: Kernel Security Tracker

# Automates the kernel security update process (baseline: Ubuntu 26.04
# "Resolute"). Every 2 weeks:
#   1. List the Resolute kernel tags on Launchpad and compare the latest with
#      KERNEL_TAG in kernel/Taskfile.yml.
#   2. Starting from the latest tag, compare each tag with the one before it
#      until a pair has CVE- commits (use the newer tag of that pair) or
#      KERNEL_TAG is reached (no security update; keep KERNEL_TAG).
#   3. Update KERNEL_TAG to the new tag and KERNEL_URL to Launchpad.
#   4. Build the kernel packages and image.
#   5. Flash images onto the Shield, run the integration tests and test
#      upgrading a Shield on the old kernel with the new .deb packages
#      (TODO: the MIMICK steps only echo their commands until login and the
#      runbooks work).
#   6. On success, open a PR with the new KERNEL_TAG and KERNEL_URL; a person
#      reviews the PR and approves the release.
#   7. Notify build, test and PR results on the run page
#      (TODO: notify by email or other channel).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # 6:00 AM UTC Mondays; the check job skips odd ISO weeks.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Latest kernel tag to check back from (default: latest Launchpad tag)'
        type: string
        default: ''

permissions:
  contents: read

# Kernel tags are looked up here, and the build fetches the new tag from here.
env:
  LP_GIT: https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute

jobs:
  # Is there a newer kernel tag with security fixes?
  check:
    runs-on: ubuntu-latest

    outputs:
      update: ${{ steps.branch.outputs.update }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      new_tag: ${{ steps.check.outputs.new_tag }}
      branch: ${{ steps.branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # GitHub cron cannot express "every 2 weeks": run weekly and skip odd
      # ISO weeks. Manual runs always check.
      - name: Check schedule
        id: schedule
        run: |
          week=$((10#$(date +%V)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((week % 2)) -ne 0 ]; then
            echo "ISO week $week is odd, skipping (runs every 2 weeks)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Find the newest tag after KERNEL_TAG that contains CVE fixes.
      - name: Look for a kernel tag with security fixes
        id: check
        if: steps.schedule.outputs.run == 'true'
        env:
          KERNEL_TAG_INPUT: ${{ inputs.kernel_tag }}
        run: |
          set -euo pipefail

          # current_tag=$(sed -n "s/^  KERNEL_TAG: '\(.*\)'$/\1/p" kernel/Taskfile.yml)
          # [ -n "$current_tag" ] \
          #   || { echo "ERROR: KERNEL_TAG not found in kernel/Taskfile.yml" >&2; exit 1; }
          current_tag="Ubuntu-7.0.0-31.31"
          echo "current_tag=$current_tag" >> "$GITHUB_OUTPUT"

          # List the tags of KERNEL_TAG's kernel version (e.g.
          # Ubuntu-7.0.0-*), oldest first, and take the latest -- or the tag
          # given to a manual run.
          # Launchpad's git server sometimes times out (HTTP 504); retry.
          retry() {
            for n in 1 2 3 4; do
              "$@" && return 0
              [ "$n" -lt 4 ] || break
              echo "Launchpad request failed (attempt $n/4), retrying in $((n * 30))s" >&2
              sleep $((n * 30))
            done
            echo "ERROR: Launchpad request failed after 4 attempts: $*" >&2
            return 1
          }

          prefix=${current_tag%-*}-
          refs=$(retry git ls-remote --tags --refs "$LP_GIT" "refs/tags/${prefix}*")
          mapfile -t tags < <(sed 's|.*refs/tags/||' <<<"$refs" \
            | grep -E "^${prefix//./\\.}[0-9]+\.[0-9]+$" | sort -V)
          [ "${#tags[@]}" -gt 0 ] || { echo "ERROR: no ${prefix}* tags in $LP_GIT" >&2; exit 1; }
          latest_tag=${KERNEL_TAG_INPUT:-${tags[-1]}}
          echo "Current: $current_tag"
          echo "Latest:  $latest_tag"

          # Positions of the current and latest tags in the list.
          cur=-1; last=-1
          for i in "${!tags[@]}"; do
            [ "${tags[$i]}" != "$current_tag" ] || cur=$i
            [ "${tags[$i]}" != "$latest_tag" ] || last=$i
          done
          [ "$cur" -ge 0 ] || { echo "ERROR: $current_tag not found in $LP_GIT" >&2; exit 1; }
          [ "$last" -ge 0 ] || { echo "ERROR: $latest_tag not found in $LP_GIT" >&2; exit 1; }
          if [ "$last" -le "$cur" ]; then
            echo "$current_tag is up to date"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commits only (no trees or blobs) are enough for git log.
          repo="$RUNNER_TEMP/resolute.git"
          retry git clone -q --bare --filter=tree:0 "$LP_GIT" "$repo"

          # Starting from the latest tag, compare each tag with the one before
          # it until a pair has CVE- commits or the current tag is reached.
          new_tag=""
          for ((i = last; i > cur; i--)); do
            prev=${tags[$((i - 1))]}
            echo "git log --oneline --grep=\"CVE-\" $prev..${tags[$i]}"
            commits=$(git -C "$repo" log --oneline --grep="CVE-" "$prev..${tags[$i]}")
            if [ -n "$commits" ]; then
              echo "$commits"
              echo "CVE commits found -> use ${tags[$i]}"
              new_tag=${tags[$i]}
              break
            fi
            echo "No CVE commits found -> go back"
          done

          if [ -z "$new_tag" ]; then
            echo "Reached $current_tag, no CVE- commits found; keeping $current_tag"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "update=true" >> "$GITHUB_OUTPUT"

      # A kernel-security/<tag> branch means that tag is already in review.
      - name: Skip if already proposed
        id: branch
        if: steps.check.outputs.update == 'true'
        env:
          NEW_TAG: ${{ steps.check.outputs.new_tag }}
        run: |
          branch="kernel-security/$NEW_TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists, skipping"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

