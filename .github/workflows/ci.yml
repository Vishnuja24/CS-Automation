name: Build Ubuntu packages

on:
  workflow_dispatch:

# # One run per PR / branch: a new push cancels the run still in progress.
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  # Install the MIMICK CLI, flash the build's images onto the bench and run
  # the tests -- one job, so every step runs on the same machine.
  test:
    runs-on: ubuntu-latest

    # # One PR on the bench at a time; keep in step with MIMICK_BENCH.
    # concurrency:
    #   group: mimick-bench-mimick10
    #   cancel-in-progress: false

    env:
      MIMICK_DOWNLOADS_URL: https://api.mimick.cloud/api/v1/downloads/mimick
      MIMICK_PLATFORM: linux-amd64
      MIMICK_BENCH: mimick10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The downloads endpoint returns metadata for the latest CLI release;
      # take the linux-amd64 tarball from it.
      - name: Download MIMICK CLI
        id: mimick_cli
        run: |
          meta=$(curl -fsSL "$MIMICK_DOWNLOADS_URL")
          [ "$(jq -r '.released' <<<"$meta")" = "true" ] \
            || { echo "ERROR: latest MIMICK CLI is not released" >&2; exit 1; }

          version=$(jq -r '.version' <<<"$meta")
          platform=$(jq -c --arg p "$MIMICK_PLATFORM" '.platforms[] | select(.platform == $p)' <<<"$meta")
          [ -n "$platform" ] || { echo "ERROR: no $MIMICK_PLATFORM build in MIMICK metadata" >&2; exit 1; }
          url=$(jq -r '.url' <<<"$platform")
          filename=$(jq -r '.filename' <<<"$platform")
          echo "MIMICK CLI $version: $url"

          cd "$RUNNER_TEMP"
          curl -fsSL "$url" -o "$filename"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Install MIMICK CLI
        working-directory: ${{ runner.temp }}
        run: |
          tar -xzf "${{ steps.mimick_cli.outputs.filename }}"
          sudo mv mimick /usr/local/bin/

      - name: Check MIMICK CLI version
        env:
          MIMICK_CLI_VERSION: ${{ steps.mimick_cli.outputs.version }}
        run: |
          installed=$(mimick --version)
          echo "Installed MIMICK CLI: $installed"
          case "$installed" in
            *"$MIMICK_CLI_VERSION"*) echo "[OK] MIMICK CLI $MIMICK_CLI_VERSION" ;;
            *) echo "ERROR: expected MIMICK CLI $MIMICK_CLI_VERSION, got '$installed'" >&2; exit 1 ;;
          esac

      # TODO: confirm the login flags against `mimick auth login --help`.
      - name: MIMICK login
        env:
          MIMICK_USERNAME: syamchandran.r@trenser.com
          MIMICK_PASSWORD: Tr3n53r@M
        run: |
          mimick auth login --username "$MIMICK_USERNAME" --password "$MIMICK_PASSWORD"
          mimick auth status

      - name: Select MIMICK bench
        run: |
          mimick bench use "$MIMICK_BENCH"

